<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serpentina</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #0B0B0C; color: #F3F3F2; font-family: "DM Sans", system-ui, sans-serif; overflow: hidden; }
  body::before { content: ""; position: fixed; inset: 0; background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.045) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(135deg, rgba(255,255,255,.045) 0 1px, transparent 1px 3px); pointer-events: none; }
  main { position: relative; min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  h1 { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-style: italic; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: clamp(48px, 10vw, 110px); line-height: .9; margin: 0 0 20px; }
  h1 span { color: #D0121B; }
  p { color: #9DA1A6; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 28px; }
  a { color: #F3F3F2; text-decoration: none; font-size: 14px; letter-spacing: .18em; text-transform: uppercase; padding: 12px 22px; border: 1px solid #D0121B; }
  a:hover { background: #D0121B; }
</style>
</head>
<body>
<main>
  <h1>Wrong <span>turn</span></h1>
  <p>That road is not on the map.</p>
  <a href="/">Back to the start</a>
</main>
</body>
</html>
