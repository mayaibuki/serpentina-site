<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serpentina</title>
<meta name="description" content="An augmented reality game for enjoying the roads worth taking">
<meta name="theme-color" content="#0B0B0C">
<meta property="og:title" content="Serpentina">
<meta property="og:description" content="An augmented reality game for enjoying the roads worth taking">
<meta property="og:type" content="website">
<meta property="og:url" content="https://serpentina.app/">
<meta property="og:image" content="https://serpentina.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0B0B0C;
    --red: #D0121B;
    --red-hi: #F01C27;
    --silver: #9DA1A6;
    --white: #F3F3F2;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink);
    color: var(--white);
    font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    position: relative;
  }
  /* carbon weave */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      repeating-linear-gradient(45deg,  rgba(255,255,255,.045) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(135deg, rgba(255,255,255,.045) 0 1px, transparent 1px 3px);
    pointer-events: none;
  }
  /* red glow, bottom right, like light on the tank */
  body::after {
    content: "";
    position: fixed; inset: 0;
    background: radial-gradient(60vmax 60vmax at 88% 92%, rgba(208,18,27,.16), rgba(208,18,27,0) 60%);
    pointer-events: none;
  }
  main {
    position: relative;
    z-index: 1;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 24px;
    animation: rise .6s ease-out both;
  }
  h1 {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-style: italic;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    font-size: clamp(56px, 11vw, 132px);
    line-height: .9;
    margin: 0 0 20px;
    color: var(--white);
  }
  h1 span { color: var(--red); }
  p {
    margin: 0 0 36px;
    max-width: 26ch;
    color: var(--silver);
    font-size: 18px;
    line-height: 1.5;
    letter-spacing: .01em;
  }
  a.cta {
    color: var(--white);
    text-decoration: none;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: .18em;
    text-transform: uppercase;
    padding: 12px 22px;
    border: 1px solid var(--red);
    transition: background .15s ease, border-color .15s ease;
  }
  a.cta:hover, a.cta:focus-visible { background: var(--red); border-color: var(--red-hi); outline: none; }
  footer {
    position: fixed; left: 0; right: 0; bottom: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    color: var(--silver);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    z-index: 1;
  }
  .ig {
    display: inline-flex;
    padding: 10px;
    margin: -10px;
    color: var(--silver);
    transition: color .15s ease;
  }
  .ig svg { width: 22px; height: 22px; display: block; }
  .ig:hover, .ig:focus-visible { color: var(--red); outline: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { main { animation: none; } a.cta, .ig { transition: none; } }
  @media (max-width: 480px) {
    p { font-size: 16px; max-width: 22ch; }
    footer { font-size: 10px; }
  }
</style>
</head>
<body>
<main>
  <h1>Serpen<span>tina</span></h1>
  <p>An augmented reality game for enjoying the roads worth taking.</p>
  <a class="cta" href="mailto:jmaya.design@gmail.com?subject=Serpentina%20early%20access">Early access</a>
</main>
<footer>
  <a class="ig" href="https://www.instagram.com/serpentina.app" target="_blank" rel="noopener" aria-label="Serpentina on Instagram">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" focusable="false">
      <rect x="2.75" y="2.75" width="18.5" height="18.5" rx="5.25"/>
      <circle cx="12" cy="12" r="4.15"/>
      <circle cx="17.45" cy="6.55" r="1.15" fill="currentColor" stroke="none"/>
    </svg>
  </a>
  <span>Serpentina &middot; San Francisco Bay Area</span>
</footer>
</body>
</html>
